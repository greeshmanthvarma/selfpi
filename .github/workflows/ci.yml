name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: SelfPi targeted tests
        working-directory: packages/selfpi
        run: |
          node "$(git rev-parse --show-toplevel)/node_modules/vitest/dist/cli.js" --run \
            test/improvement-cycle.test.ts \
            test/container-harness-runner.test.ts \
            test/promote-run.test.ts \
            test/rollback-version.test.ts

      - name: SelfPi candidate-policy validation
        working-directory: packages/selfpi
        run: node "$(git rev-parse --show-toplevel)/node_modules/vitest/dist/cli.js" --run test/candidate-policy.test.ts

      - name: SelfPi artifact-redaction checks
        working-directory: packages/selfpi
        run: |
          node "$(git rev-parse --show-toplevel)/node_modules/vitest/dist/cli.js" --run \
            test/sealed-evidence-bundle.test.ts \
            test/inspect-run.test.ts \
            test/milestone4-run-record.test.ts
